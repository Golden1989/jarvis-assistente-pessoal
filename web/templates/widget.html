<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jarvis</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='orb.css') }}">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #04060b;
    }
    #widget-stage {
      width: 100%;
      height: 100%;
      position: relative;
      cursor: pointer;
    }
    #orb-canvas {
      width: 100%;
      height: 100%;
    }
    /* Serious mode: the page background loses its blue tint (the orb has its own palette, see orb.css). */
    html.serious, html.serious body { background: #080506; }
  </style>
</head>
<body>
  <div id="widget-stage">
    <div id="orb-canvas"></div>
  </div>

  <script src="{{ url_for('static', filename='orb.js') }}"></script>
  <script src="{{ url_for('static', filename='widget.js') }}"></script>
</body>
</html>
